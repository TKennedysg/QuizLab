<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Entrena tu curiosidad con retos de tecnología, ciencia y cultura general."
    />
    <meta name="theme-color" content="#f7f8f4" />
    <title>QuizLab · Entrena tu curiosidad</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="questions.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="./" aria-label="QuizLab, inicio"
        ><span class="brand-mark">q<span>•</span></span
        >QuizLab<span class="brand-dot">.</span></a
      >
      <div class="nav-caption">TU ESPACIO</div>
      <nav>
        <button class="nav-link active" data-nav="home">
          <span data-icon="compass"></span>Explorar retos</button
        ><button class="nav-link" data-nav="history">
          <span data-icon="history"></span>Mi historial<span
            id="history-count"
            class="nav-count"
            >0</span
          >
        </button>
      </nav>
      <div class="sidebar-note">
        <span data-icon="sparkles"></span
        ><strong>La curiosidad se entrena.</strong>
        <p>Unas preguntas hoy.<br />Una idea nueva mañana.</p>
      </div>
      <div class="sidebar-bottom">
        <span class="local-dot"></span>Tu progreso, en este navegador
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <span id="breadcrumb">Tu zona de aprendizaje</span>
        <div class="profile">
          <span class="desktop-only">Hola, mente curiosa</span
          ><span class="avatar" aria-hidden="true">Q</span>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        <span>QuizLab / Un pequeño reto. Una nueva idea.</span
        ><span>Hecho para aprender a tu ritmo ↗</span>
      </footer>
    </div>
    <div id="storage-banner" class="storage-banner" role="status" hidden></div>
    <dialog
      id="confirm-dialog"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-text"
    >
      <div class="dialog-icon" data-icon="info"></div>
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="button secondary" id="dialog-cancel">Cancelar</button
        ><button class="button primary" id="dialog-confirm">Confirmar</button>
      </div>
    </dialog>
    <noscript
      ><p class="noscript">
        Activa JavaScript para utilizar los cuestionarios.
      </p></noscript
    >
  </body>
</html>
